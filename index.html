<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bounce Infinite 2.0</title>
    
    <!-- Tambahan Favicon (Logo Tab Browser Bola Merah) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ef4444'/><circle cx='35' cy='35' r='15' fill='rgba(255,255,255,0.6)'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi Bola Pantul di Landing Page */
@keyframes bounce-intro {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    45% { transform: translateY(180px) scale(1, 1); }
    50% { transform: translateY(200px) scale(1.1, 0.8); } /* Efek squish saat menyentuh lantai */
    55% { transform: translateY(180px) scale(1, 1); }
}

@keyframes shadow-pulse {
    0%, 100% { transform: scale(0.5); opacity: 0.2; }
    50% { transform: scale(1.2); opacity: 0.6; }
}

.bouncing-ball-intro {
    position: absolute;
    right: 15%; 
    top: 25%;
    width: 70px;
    height: 70px;
    background: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444);
    border-radius: 50%;
    box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5);
    animation: bounce-intro 1.5s infinite ease-in-out;
}

.bouncing-ball-shadow {
    position: absolute;
    right: 15%;
    top: calc(25% + 210px);
    width: 60px;
    height: 10px;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 50%;
    filter: blur(3px);
    animation: shadow-pulse 1.5s infinite ease-in-out;
}

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        
        /* UI Layers */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            z-index: 50;
            backdrop-filter: blur(5px);
        }

        #game-ui {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* Mobile Controls Layout */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none; 
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
            pointer-events: none; 
        }
        
        .controls-group {
            display: flex;
            gap: 10px;
            pointer-events: auto; 
        }

        .control-btn {
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: white;
            backdrop-filter: blur(5px);
            transition: transform 0.1s, background-color 0.1s;
        }
        .control-btn:active {
            background-color: rgba(255, 255, 255, 0.4);
            transform: scale(0.9);
        }
        
        .btn-action-up { background-color: rgba(234, 179, 8, 0.3); border-color: rgba(234, 179, 8, 0.5); color: #fde047; }
        .btn-action-down { background-color: rgba(59, 130, 246, 0.3); border-color: rgba(59, 130, 246, 0.5); color: #93c5fd; }

        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
            #top-right-ui {
                top: 15px;
                right: 15px;
                gap: 8px;
            }
            #top-right-ui button {
                padding: 6px 10px;
                font-size: 14px;
            }
            #game-ui h1 { font-size: 1.5rem; }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- 1. Landing Page -->
    <div id="landing-page" class="overlay">
        <div class="bouncing-ball-shadow hidden md:block"></div>
        <div class="bouncing-ball-intro hidden md:block"></div>
        <h1 class="text-5xl md:text-6xl font-black text-red-500 mb-2 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">BOUNCE</h1>
        <h2 class="text-2xl md:text-3xl font-bold text-yellow-400 mb-8">INFINITE 2.0</h2>
        <h1 class="text-5xl md:text-6xl font-black text-red-500 mb-2 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">BOUNCE</h1>
        <h2 class="text-2xl md:text-3xl font-bold text-yellow-400 mb-8">INFINITE 2.0</h2>
        
        <div class="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl border border-slate-700 w-11/12 max-w-md text-center">
            <p class="text-slate-300 mb-6 text-sm md:text-base">Masukan nama antek antek asing</p>
            <input type="text" id="player-name" placeholder="Nama Pemain" maxlength="15"

    <!-- 2. Game UI Overlay Kiri Atas -->
    <div id="game-ui">

        <p class="text-xs md:text-sm font-bold text-white mt-1">Bounce Power: <span id="bounce-power-display" class="text-green-400">Lv. 0</span></p>

    <!-- UI Pause & End Game Kanan Atas -->

            <span class="text-yellow-400 font-black">||</span> <span class="hidden md:inline">Pause</span>
        </button>
        <button id="btn-end" class="bg-red-600/80 border border-red-500 text-white px-3 md:px-4 py-2 rounded-lg backdrop-blur-md hover:bg-red-500 font-bold transition shadow-lg flex items-center gap-1">
            <span class="font-black">⏹</span> <span class="hidden md:inline">Akhiri</span>
        </button>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    
    <!-- Mobile Touch Controls Layout Kiri Kanan -->
    <div id="mobile-controls">
        <div class="controls-group">
            <div class="control-btn" id="btn-left">←</div>
            <div class="control-btn" id="btn-right">→</div>
        </div>
        <div class="controls-group">
            <div class="control-btn btn-action-down" id="btn-down">↓</div>
            <div class="control-btn btn-action-up" id="btn-up">↑</div>
        </div>
    </div>

    <!-- Pause Menu Page -->
    <div id="pause-page" class="overlay hidden z-[60]">
        <h1 class="text-5xl md:text-6xl font-black text-white mb-2 drop-shadow-lg tracking-widest">PAUSED</h1>
        <p class="text-lg md:text-xl text-slate-300 mb-8 font-medium">Permainan Sedang Dijeda</p>
        <div class="flex flex-col gap-4 w-10/12 max-w-xs">
            <button id="btn-resume" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-lg transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                LANJUTKAN
            </button>
            <button id="btn-end-pause" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-6 rounded-lg transition-all transform hover:scale-105 shadow-[0_0_15px_rgba(220,38,38,0.5)]">
                AKHIRI PERMAINAN
            </button>
        </div>
    </div>

    <!-- 3. Game Over & Leaderboard Page -->
    <div id="game-over-page" class="overlay hidden z-[70]">
        <h1 class="text-5xl font-black text-red-600 mb-2">GAME OVER</h1>
        <h2 class="text-xl md:text-2xl text-white mb-6">Skor Kamu: <span id="final-score" class="text-yellow-400 font-bold">0</span></h2>
        
        <div class="bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 w-11/12 max-w-md overflow-hidden flex flex-col h-[300px] md:h-[350px]">
            <div class="bg-slate-900 py-3 text-center border-b border-slate-700 text-yellow-400 font-bold tracking-widest text-sm md:text-base">
                GLOBAL LEADERBOARD
            </div>
            
            <div id="leaderboard-loading" class="flex-1 flex justify-center items-center text-slate-400 text-sm">
                Memuat skor...
            </div>
            
            <ul id="leaderboard-list" class="flex-1 overflow-y-auto scrollbar-hide p-0 m-0 hidden text-sm md:text-base">
                <!-- Leaderboard items will be injected here -->
            </ul>
        </div>
        
        <button id="btn-restart" class="mt-6 md:mt-8 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 md:px-10 rounded-lg transition-all shadow-lg shadow-blue-500/50">
            MAIN LAGI
        </button>
    </div>

</div>

<!-- Firebase & Game Engine Logic -->
<script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = 'https://lsuuspwufwzcukduriwp.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzdXVzcHd1Znd6Y3VrZHVyaXdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTg5MDcsImV4cCI6MjEwODI5NDkwN30.Ej-jim68n4OPNZqDMVN3OLJS7sgVXLyM75A8KWDoNec'; 
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    const CUSTOM_BGM_URL = ""; 
    const PLAYER_IMAGE_URL = ""; 
    const ENEMY_IMAGE_URL = ""; 

    let bgmAudio = null;
    if (CUSTOM_BGM_URL !== "") {
        bgmAudio = new Audio(CUSTOM_BGM_URL);
        bgmAudio.loop = true;
        bgmAudio.volume = 0.5;
    }

    const playerImg = new Image();
    let playerImgLoaded = false;
    if (PLAYER_IMAGE_URL !== "") {
        playerImg.onload = () => { playerImgLoaded = true; };
        playerImg.src = PLAYER_IMAGE_URL;
    }

    const enemyImg = new Image();
    let enemyImgLoaded = false;
    if (ENEMY_IMAGE_URL !== "") {
        enemyImg.onload = () => { enemyImgLoaded = true; };
        enemyImg.src = ENEMY_IMAGE_URL;
    }

    let supabase = null;
    let dbReady = false;

    if (SUPABASE_URL !== "" && SUPABASE_KEY !== "") {
        try {
            supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
            dbReady = true;
            
            // --- Fitur Realtime Listener Supabase ---
            // Memantau tabel leaderboard, jika ada skor baru masuk, leaderboard otomatis di-refresh
            supabase
              .channel('public:leaderboard')
              .on('postgres_changes', { event: '*', schema: 'public', table: 'leaderboard' }, payload => {
                  const gameOverPageUI = document.getElementById('game-over-page');
                  // Hanya refresh visual jika layar game over (leaderboard) sedang terbuka
                  if (gameOverPageUI && !gameOverPageUI.classList.contains('hidden')) {
                      refreshLeaderboard();
                  }
              })
              .subscribe();
              
        } catch (e) {
            console.error("Supabase init failed", e);
        }
    }

    // --- ENGINE SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const landingPage = document.getElementById('landing-page');
    const gameUI = document.getElementById('game-ui');
    const topRightUI = document.getElementById('top-right-ui');
    const gameOverPage = document.getElementById('game-over-page');
    const pausePage = document.getElementById('pause-page');
    const mobileControls = document.getElementById('mobile-controls');
    
    const playerNameInput = document.getElementById('player-name');
    const btnStart = document.getElementById('btn-start');
    const btnRestart = document.getElementById('btn-restart');
    const btnPause = document.getElementById('btn-pause');
    const btnEnd = document.getElementById('btn-end');
    const btnResume = document.getElementById('btn-resume');
    const btnEndPause = document.getElementById('btn-end-pause');

    const scoreDisplay = document.getElementById('score-display');
    const bouncePowerDisplay = document.getElementById('bounce-power-display');
    const finalScoreDisplay = document.getElementById('final-score');
    
    // MENGHAPUS CREATOR & PRORUNNER
    let localLeaderboard = []; 
    
    let playerName = "Player";
    let gameLoopId;

    const config = {
        gravity: 0.6,
        friction: 0.85,
        moveSpeed: 16,        
        maxSpeed: 14,         
        baseJump: -10,        
        bounceIncrement: -1.5,
        upBoost: -5,          
        maxBounces: 5,        
        ballRadius: 15,
        floorY: 550,
        autoScrollSpeed: 3.5  
    };

    let state = {
        score: 0,
        cameraX: 0,
        isGameOver: false,
        isPlaying: false,
        isPaused: false,
        bounceMultiplier: 0
    };

    const keys = { left: false, right: false, up: false, down: false };

    let player = { x: 0, y: 0, vx: 0, vy: 0, radius: config.ballRadius };
    let platforms = [], spikes = [], rings = [], enemies = [];
    let latestGenX = 0;

    // --- INPUT HANDLING ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
        if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
        
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
            togglePause();
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
        if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
    });

    const bindTouch = (id, keyName) => {
        const btn = document.getElementById(id);
        if(!btn) return;
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
    };
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');
    bindTouch('btn-up', 'up');
    bindTouch('btn-down', 'down');

    // --- PROCEDURAL GENERATION ---
    function initWorld() {
        platforms = []; spikes = []; rings = []; enemies = [];
        latestGenX = 500;
        
        player = { x: 300, y: 300, vx: 0, vy: 0, radius: config.ballRadius };
        
        state.score = 0;
        state.cameraX = 0;
        state.bounceMultiplier = 0;
        state.isGameOver = false;
        state.isPlaying = true;
        state.isPaused = false;
        
        scoreDisplay.innerText = "0";
        pausePage.classList.add('hidden');
        updateBounceUI();
    }

    function generateChunk(targetX) {
        while (latestGenX < targetX + 2000) {
            let chunkWidth = Math.random() * 300 + 200;
            let startX = latestGenX;
            
            if (Math.random() > 0.5) {
                let pWidth = Math.random() * 150 + 100;
                let pHeight = 350 + (Math.random() * 100 - 50);
                platforms.push({ x: startX + 50, y: pHeight, w: pWidth, h: 20 });
                
                if(Math.random() > 0.3) {
                    rings.push({ x: startX + 50 + pWidth/2, y: pHeight - 40, r: 15, collected: false });
                }
            }

            if (Math.random() > 0.5) {
                rings.push({ x: startX + chunkWidth / 2, y: config.floorY - 60, r: 15, collected: false });
            }

            if (Math.random() > 0.4 && startX > 1000) {
                let spikeWidth = 40 + Math.random() * 40;
                spikes.push({ x: startX + chunkWidth/2, y: config.floorY - 20, w: spikeWidth, h: 20 });
            }

            if (startX > 1500) {
                if (Math.random() > 0.6) {
                    enemies.push({ 
                        type: 'vertical', x: startX + 100, y: config.floorY - 100, 
                        minY: config.floorY - 250, maxY: config.floorY - 30, 
                        speed: 3 + Math.random() * 2, r: 15, dir: 1 
                    });
                } else if (Math.random() > 0.7) {
                    enemies.push({ 
                        type: 'horizontal', x: startX + chunkWidth, 
                        y: config.floorY - 30 - Math.random() * 100, 
                        speed: -(2 + Math.random() * 2), r: 15 
                    });
                }
            }
            latestGenX = startX + chunkWidth;
        }
    }

    function garbageCollect() {
        let cutoff = state.cameraX - 500;
        platforms = platforms.filter(p => p.x + p.w > cutoff);
        spikes = spikes.filter(s => s.x + s.w > cutoff);
        rings = rings.filter(r => !r.collected && r.x > cutoff);
        enemies = enemies.filter(e => e.type === 'horizontal' ? e.x > cutoff - 2000 : e.x > cutoff); 
    }

    function checkRectCollision(px, py, pr, rect) {
        return (px + pr > rect.x && px - pr < rect.x + rect.w &&
                py + pr > rect.y && py - pr < rect.y + rect.h);
    }

    function updateBounceUI() {
        bouncePowerDisplay.innerText = `Lv. ${state.bounceMultiplier}`;
        if(state.bounceMultiplier === config.maxBounces) {
            bouncePowerDisplay.className = "text-red-500 font-black animate-pulse";
        } else if (state.bounceMultiplier > 0) {
            bouncePowerDisplay.className = "text-yellow-400 font-bold";
        } else {
            bouncePowerDisplay.className = "text-green-400";
        }
    }

    // --- GAME LOOP UPDATE ---
    function update() {
        if (state.isGameOver || !state.isPlaying || state.isPaused) return;

        let currentScrollSpeed = config.autoScrollSpeed + (state.score * 0.05);
        state.cameraX += currentScrollSpeed;

        if (latestGenX < player.x + 2000) {
            generateChunk(Math.max(player.x, state.cameraX));
            garbageCollect();
        }

        if (keys.left || keys.right) {
            state.bounceMultiplier = 0; 
            updateBounceUI();
        }

        if (keys.left) player.vx -= config.moveSpeed * 0.15;
        if (keys.right) player.vx += config.moveSpeed * 0.15;

        player.vx *= config.friction;
        if (player.vx > config.maxSpeed) player.vx = config.maxSpeed;
        if (player.vx < -config.maxSpeed) player.vx = -config.maxSpeed;

        player.vy += config.gravity;
        
        if (keys.down) {
            player.vy += 2.5; 
        }

        player.x += player.vx;
        for (let p of platforms) {
            if (checkRectCollision(player.x, player.y, player.radius, p)) {
                if (player.vx > 0) player.x = p.x - player.radius;
                else if (player.vx < 0) player.x = p.x + p.w + player.radius;
                player.vx = 0;
            }
        }

        if (player.x - player.radius < state.cameraX) {
            triggerGameOver("Tertinggal Kamera!");
            return;
        }

        if (player.x + player.radius > state.cameraX + canvas.width) {
            player.x = state.cameraX + canvas.width - player.radius;
            player.vx = 0;
        }

        player.y += player.vy;
        let hitFloor = false;

        if (player.y + player.radius >= config.floorY) {
            player.y = config.floorY - player.radius;
            hitFloor = true;
        }

        for (let p of platforms) {
            if (checkRectCollision(player.x, player.y, player.radius, p)) {
                if (player.vy > 0) { 
                    player.y = p.y - player.radius;
                    hitFloor = true;
                } else if (player.vy < 0) { 
                    player.y = p.y + p.h + player.radius;
                    player.vy = 0;
                }
            }
        }

        if (hitFloor) {
            if (!keys.left && !keys.right && Math.abs(player.vx) < 1) {
                state.bounceMultiplier = Math.min(state.bounceMultiplier + 1, config.maxBounces);
            } else {
                state.bounceMultiplier = 0;
            }
            updateBounceUI();

            let finalJumpSpeed = config.baseJump + (state.bounceMultiplier * config.bounceIncrement);
            
            if (keys.up) {
                finalJumpSpeed += config.upBoost;
            }

            player.vy = finalJumpSpeed;
        }

        for (let e of enemies) {
            if (e.type === 'vertical') {
                e.y += e.speed * e.dir;
                if (e.y < e.minY) { e.y = e.minY; e.dir = 1; }
                if (e.y > e.maxY) { e.y = e.maxY; e.dir = -1; }
            } else if (e.type === 'horizontal') {
                e.x += e.speed;
            }
            
            let dx = player.x - e.x;
            let dy = player.y - e.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < player.radius + e.r - 4) { 
                triggerGameOver("Menabrak Musuh!");
                return;
            }
        }

        for (let s of spikes) {
            if (checkRectCollision(player.x, player.y, player.radius - 3, s)) {
                triggerGameOver("Terkena Duri!");
                return;
            }
        }

        if (player.y > canvas.height + 200) {
            triggerGameOver("Jatuh ke Jurang!");
            return;
        }

        for (let r of rings) {
            if (!r.collected) {
                let dx = player.x - r.x;
                let dy = player.y - r.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < player.radius + r.r) {
                    r.collected = true;
                    state.score += 1;
                    scoreDisplay.innerText = state.score;
                }
            }
        }
    }

    // --- GAME LOOP DRAW ---
    function draw() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        for(let i=0; i<60; i++) {
            let px = ((i * 150) - (state.cameraX * 0.1)) % canvas.width;
            if(px < 0) px += canvas.width;
            let py = (i * 70) % canvas.height;
            ctx.fillRect(px, py, 3, 3);
        }

        ctx.save();
        ctx.translate(-state.cameraX, 0);

        ctx.fillStyle = '#1e293b'; 
        ctx.fillRect(state.cameraX, config.floorY, canvas.width + 100, canvas.height - config.floorY); 
        ctx.fillStyle = '#475569'; 
        ctx.fillRect(state.cameraX, config.floorY, canvas.width + 100, 6);

        for (let p of platforms) {
            ctx.fillStyle = '#334155'; ctx.fillRect(p.x, p.y, p.w, p.h);
            ctx.fillStyle = '#475569'; ctx.fillRect(p.x, p.y, p.w, 6);
        }

        ctx.fillStyle = '#ef4444'; 
        for (let s of spikes) {
            let numSpikes = Math.floor(s.w / 20);
            for (let i = 0; i < numSpikes; i++) {
                ctx.beginPath();
                ctx.moveTo(s.x + (i * 20), s.y + s.h);
                ctx.lineTo(s.x + (i * 20) + 10, s.y);
                ctx.lineTo(s.x + (i * 20) + 20, s.y + s.h);
                ctx.fill();
            }
        }

        ctx.lineWidth = 4;
        for (let r of rings) {
            if (!r.collected) {
                ctx.strokeStyle = '#facc15'; 
                ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
                
                ctx.strokeStyle = 'rgba(250, 204, 21, 0.4)';
                ctx.lineWidth = 8;
                ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
                ctx.lineWidth = 4;
            }
        }

        for (let e of enemies) {
            if (enemyImgLoaded) {
                ctx.drawImage(enemyImg, e.x - e.r, e.y - e.r, e.r * 2, e.r * 2);
            } else {
                ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                ctx.fillStyle = '#a855f7'; ctx.fill();
                
                ctx.beginPath(); ctx.arc(e.x - 4, e.y - 4, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#f3e8ff'; ctx.fill();
                
                ctx.shadowBlur = 10; ctx.shadowColor = '#d8b4fe'; ctx.stroke(); ctx.shadowBlur = 0;
            }
        }

        if (playerImgLoaded) {
            if (state.bounceMultiplier > 0) {
                ctx.shadowBlur = 10 + (state.bounceMultiplier * 5);
                ctx.shadowColor = state.bounceMultiplier === config.maxBounces ? '#ef4444' : '#facc15';
            }
            ctx.drawImage(playerImg, player.x - player.radius, player.y - player.radius, player.radius * 2, player.radius * 2);
            ctx.shadowBlur = 0;
        } else {
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            if (state.bounceMultiplier > 0) {
                ctx.shadowBlur = 10 + (state.bounceMultiplier * 5);
                ctx.shadowColor = state.bounceMultiplier === config.maxBounces ? '#ef4444' : '#facc15';
            } else {
                ctx.shadowBlur = 0;
            }
            ctx.fillStyle = '#ef4444'; ctx.fill(); ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.arc(player.x - 4, player.y - 4, player.radius / 3, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.fill();
        }

        ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
        let grad = ctx.createLinearGradient(state.cameraX, 0, state.cameraX + 50, 0);
        grad.addColorStop(0, 'rgba(239, 68, 68, 0.6)');
        grad.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(state.cameraX, 0, 50, canvas.height);

        ctx.restore();
    }

    function gameLoop() {
        update();
        draw();
        gameLoopId = requestAnimationFrame(gameLoop);
    }

    // --- FITUR PAUSE DAN AKHIRI ---
    function togglePause() {
        if (state.isGameOver || !state.isPlaying) return;
        state.isPaused = !state.isPaused;
        
        if (state.isPaused) {
            pausePage.classList.remove('hidden');
            if (bgmAudio) bgmAudio.pause();
        } else {
            pausePage.classList.add('hidden');
            if (bgmAudio) bgmAudio.play().catch(e => console.warn(e));
        }
    }

    function endGameEarly() {
        if (state.isGameOver || !state.isPlaying) return;
        state.isPaused = false; 
        pausePage.classList.add('hidden');
        triggerGameOver("Permainan Diakhiri");
    }

    btnPause.addEventListener('click', togglePause);
    btnResume.addEventListener('click', togglePause);
    btnEnd.addEventListener('click', endGameEarly);
    btnEndPause.addEventListener('click', endGameEarly);

    // --- GAME CONTROL ---
    function startGame() {
        const inputName = playerNameInput.value.trim();
        if (inputName !== "") playerName = inputName;

        landingPage.style.display = 'none';
        canvas.style.display = 'block';
        gameUI.style.display = 'block';
        topRightUI.classList.remove('hidden');
        
        if (window.innerWidth <= 768) mobileControls.style.display = 'flex';

        if (bgmAudio) {
            bgmAudio.currentTime = 0;
            bgmAudio.play().catch(e => console.warn("Auto-play prevented by browser:", e));
        }

        initWorld();
        if(!gameLoopId) gameLoopId = requestAnimationFrame(gameLoop);
    }

    async function triggerGameOver(reason) {
        state.isGameOver = true;
        state.isPlaying = false;
        
        if (bgmAudio) bgmAudio.pause();
        
        gameUI.style.display = 'none';
        topRightUI.classList.add('hidden');
        mobileControls.style.display = 'none';
        
        finalScoreDisplay.innerText = state.score;
        gameOverPage.classList.remove('hidden');
        
        await saveAndLoadLeaderboard();
    }

    // --- SUPABASE LEADERBOARD LOGIC ---
    
    // Fungsi untuk menarik ulang data leaderboard murni dari Database
    async function refreshLeaderboard() {
        if (!dbReady) return;
        try {
            const { data: topScores, error: fetchError } = await supabase
                .from('leaderboard')
                .select('name, score')
                .order('score', { ascending: false })
                .limit(50);

            if (fetchError) throw fetchError;
            renderLeaderboardUI(topScores);
        } catch (e) {
            console.error("Gagal menarik leaderboard dari Supabase:", e);
        }
    }

    async function saveAndLoadLeaderboard() {
        const lbList = document.getElementById('leaderboard-list');
        const loading = document.getElementById('leaderboard-loading');
        
        lbList.classList.add('hidden');
        loading.classList.remove('hidden');

        if (dbReady) {
            try {
                // Insert skor pengguna ke database
                const { error: insertError } = await supabase
                    .from('leaderboard')
                    .insert([{ name: playerName, score: state.score }]);
                    
                if (insertError) throw insertError;

                // Segera tarik data yang baru setelah insert berhasil
                await refreshLeaderboard();
                
            } catch (e) {
                console.error("Supabase Error (Kemungkinan RLS aktif/Koneksi putus):", e);
                renderLocalLeaderboard(); // Fallback jika gagal insert
            }
        } else {
            renderLocalLeaderboard();
        }
        
        loading.classList.add('hidden');
        lbList.classList.remove('hidden');
    }

    function renderLocalLeaderboard() {
        // Hanya memunculkan skor pemain saja karena data dummy sudah dihapus
        localLeaderboard.push({ name: playerName, score: state.score });
        localLeaderboard.sort((a, b) => b.score - a.score);
        renderLeaderboardUI(localLeaderboard.slice(0, 10));
    }

    function renderLeaderboardUI(data) {
        const lbList = document.getElementById('leaderboard-list');
        lbList.innerHTML = '';
        
        // Jika data kosong
        if (data.length === 0) {
            lbList.innerHTML = '<li class="text-center py-4 text-slate-400">Belum ada skor yang tercatat. Jadilah yang pertama!</li>';
            return;
        }
        
        data.forEach((entry, idx) => {
            const li = document.createElement('li');
            li.className = `flex justify-between items-center py-2 md:py-3 px-4 md:px-6 border-b border-slate-700 ${idx === 0 ? 'bg-slate-700/50' : ''}`;
            
            const isMe = entry.name === playerName && entry.score === state.score;
            if(isMe) li.classList.add('bg-slate-700');

            let rankColor = 'text-slate-400';
            if(idx === 0) rankColor = 'text-yellow-400 font-black text-lg md:text-xl drop-shadow-[0_0_5px_rgba(250,204,21,0.5)]';
            else if(idx === 1) rankColor = 'text-slate-300 font-bold';
            else if(idx === 2) rankColor = 'text-amber-600 font-bold';

            li.innerHTML = `
                <div class="flex items-center">
                    <span class="w-6 md:w-8 ${rankColor}">#${idx + 1}</span>
                    <span class="text-white font-medium ml-2 ${isMe ? 'text-red-400 font-bold' : ''}">${entry.name}</span>
                </div>
                <span class="text-yellow-400 font-bold">${entry.score} R</span>
            `;
            lbList.appendChild(li);
        });
    }

    btnStart.addEventListener('click', startGame);
    btnRestart.addEventListener('click', () => {
        gameOverPage.classList.add('hidden');
        startGame();
    });

    window.addEventListener('resize', () => {
        canvas.width = Math.min(window.innerWidth, 1200);
        canvas.height = window.innerHeight;
    });
    
    canvas.width = Math.min(window.innerWidth, 1200);
    canvas.height = window.innerHeight;

</script>
