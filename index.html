<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bounce Infinite 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Mencegah layar bergeser/zoom saat disentuh */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }
        
        /* UI Layers */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            z-index: 50;
            backdrop-filter: blur(5px);
        }

        #game-ui {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* Mobile Controls Layout */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none; /* Akan diubah ke flex saat di HP */
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
            pointer-events: none; /* Agar area kosong tidak memblokir sentuhan ke canvas */
        }
        
        .controls-group {
            display: flex;
            gap: 10px;
            pointer-events: auto; /* Mengaktifkan sentuhan hanya pada area tombol */
        }
