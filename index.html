<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bounce Classic 2.0</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ef4444'/><circle cx='35' cy='35' r='15' fill='rgba(255,255,255,0.6)'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>

    @keyframes bounce-intro {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        45% { transform: translateY(180px) scale(1, 1); }
        50% { transform: translateY(200px) scale(1.1, 0.8); } 
        55% { transform: translateY(180px) scale(1, 1); }
    }

    @keyframes shadow-pulse {
        0%, 100% { transform: scale(0.5); opacity: 0.2; }
        50% { transform: scale(1.2); opacity: 0.6; }
    }

    .bouncing-ball-intro {
        position: absolute;
        right: 10%; 
        top: 25%;
        width: 70px;
        height: 70px;
        background: radial-gradient(circle at 35% 35%, #fca5a5, #ef4444);
        border-radius: 50%;
        box-shadow: 0 5px 15px rgba(239, 68, 68, 0.5);
        animation: bounce-intro 1.5s infinite ease-in-out;
        z-index: 0;
    }

    .bouncing-ball-shadow {
        position: absolute;
        right: 10%;
        top: calc(25% + 210px);
        width: 60px;
        height: 10px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        filter: blur(3px);
        animation: shadow-pulse 1.5s infinite ease-in-out;
        z-index: 0;
    }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0f172a;
        color: white;
        font-family: 'Inter', sans-serif;
        touch-action: none; 
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
    }
    #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    canvas {
        background: linear-gradient(to bottom, #1e293b, #0f172a);
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: none;
    }
    
    .overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(15, 23, 42, 0.9);
        z-index: 50;
        backdrop-filter: blur(5px);
    }

    #landing-content-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        z-index: 10;
        width: 100%;
    }

    @media (min-width: 768px) {
        #landing-content-wrapper {
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
            max-width: 1000px;
        }
    }

    #game-ui {
        position: absolute;
        top: 15px;
        left: 15px;
        pointer-events: none;
        z-index: 10;
        display: none;
    }

    #mobile-controls {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        display: none; 
        justify-content: space-between;
        padding: 0 20px;
        box-sizing: border-box;
        z-index: 20;
        pointer-events: none; 
    }
    
    .controls-group {
        display: flex;
        gap: 10px;
        pointer-events: auto; 
    }

    .control-btn {
        background-color: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        width: 65px;
        height: 65px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        color: white;
        backdrop-filter: blur(5px);
        transition: transform 0.1s, background-color 0.1s;
    }
    .control-btn:active {
        background-color: rgba(255, 255, 255, 0.4);
        transform: scale(0.9);
    }
    
    .btn-action-up { background-color: rgba(234, 179, 8, 0.3); border-color: rgba(234, 179, 8, 0.5); color: #fde047; }
    .btn-action-down { background-color: rgba(59, 130, 246, 0.3); border-color: rgba(59, 130, 246, 0.5); color: #93c5fd; }

    /* Skin Selector Styles */
    .skin-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        transition: all 0.2s ease;
        opacity: 1;
    }
    .skin-item.locked {
        opacity: 0.4;
        filter: grayscale(100%);
        cursor: not-allowed;
    }
    .skin-circle {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 3px solid transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }
    .skin-item.selected .skin-circle {
        border-color: white;
        transform: scale(1.1);
        box-shadow: 0 0 15px rgba(255,255,255,0.5);
    }
    .locked-icon {
        position: absolute;
        font-size: 20px;
