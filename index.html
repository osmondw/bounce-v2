<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P File Share (WebRTC)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        input, button { padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; width: 90%; font-size: 16px; box-sizing: border-box; }
        button { background: #0070f3; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #005bb5; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-copy { background: #28a745; }
        .btn-copy:hover { background: #218838; }
        #progressContainer { display: none; margin-top: 20px; }
        progress { width: 100%; height: 20px; }
        #status { margin-top: 10px; font-weight: bold; color: #333; }
        #linkContainer { display: none; margin: 15px 0; padding: 10px; background: #e9ecef; border-radius: 5px; word-break: break-all; }
    </style>
</head>
<body>

<div class="card">
    <h2>Kirim File P2P</h2>
    
    <div id="setupSection">
        <p id="instructionText">Buat link untuk mulai membagikan file secara langsung.</p>
        <button id="createLinkBtn" onclick="createRoom()">Buat Link Share</button>
    </div>

    <div id="linkContainer">
        <p><strong>Link Akses:</strong></p>
        <p id="shareLinkText"></p>
        <button class="btn-copy" onclick="copyLink()">Salin Link</button>
    </div>

    <div id="fileSection" style="display:none; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
        <p>Status: <span id="status">Menunggu penerima membuka link...</span></p>
        <input type="file" id="fileInput">
        <button onclick="sendFile()">Kirim File</button>
        <button class="btn-danger" onclick="disconnectAll()">Tutup Koneksi / Nonaktifkan Link</button>
    </div>

    <div id="progressContainer">
        <p id="progressText">Mentransfer: 0%</p>
        <progress id="progressBar" value="0" max="100"></progress>
    </div>
</div>

<script>
    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = 'https://lsuuspwufwzcukduriwp.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzdXVzcHd1Znd6Y3VrZHVyaXdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MTg5MDcsImV4cCI6MjEwODI5NDkwN30.Ej-jim68n4OPNZqDMVN3OLJS7sgVXLyM75A8KWDoNec'; 
    
    // Perbaikan: Ubah nama variabel agar tidak bentrok dengan CDN bawaan browser
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- VARIABEL GLOBAL ---
    let peerConnection;
    let dataChannel;
    let roomChannel;
    let receiveBuffer = [];
    let receivedSize = 0;
    let incomingFileInfo = null;
    let inactivityTimer = null;
    const INACTIVITY_LIMIT = 30 * 60 * 1000; 

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        if (roomId) {
            document.getElementById('setupSection').style.display = 'none';
            joinRoom(roomId);
        }
    };

    function resetActivityTimer() {
        if (inactivityTimer) clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(() => {
            alert('Sesi telah ditutup otomatis karena tidak ada aktivitas selama 30 menit.');
            disconnectAll();
        }, INACTIVITY_LIMIT);
    }

    function createRoom() {
        const roomId = Math.random().toString(36).substring(2, 10);
        const shareLink = window.location.origin + window.location.pathname + '?room=' + roomId;
        
        document.getElementById('createLinkBtn').style.display = 'none';
        document.getElementById('instructionText').style.display = 'none';
        document.getElementById('linkContainer').style.display = 'block';
        document.getElementById('shareLinkText').innerText = shareLink;
        document.getElementById('fileSection').style.display = 'block';

        connectSupabase(roomId, true);
        resetActivityTimer();
    }

    function copyLink() {
        const link = document.getElementById('shareLinkText').innerText;
        navigator.clipboard.writeText(link);
        alert('Link disalin!');
    }

    function joinRoom(roomId) {
        document.getElementById('fileSection').style.display = 'block';
        document.getElementById('status').innerText = 'Menghubungkan ke pengirim...';
        connectSupabase(roomId, false);
        resetActivityTimer();
    }

    function connectSupabase(roomId, isHost) {
        // Menggunakan supabaseClient yang baru
        roomChannel = supabaseClient.channel('room-' + roomId, {
            config: { broadcast: { self: false } }
        });

        roomChannel.on('broadcast', { event: 'signal' }, ({ payload }) => handleSignalingData(payload))
                   .subscribe(async (status) => {
                       if (status === 'SUBSCRIBED' && !isHost) {
                           roomChannel.send({ type: 'broadcast', event: 'signal', payload: { type: 'join' } });
                       }
                   });
    }

    async function handleSignalingData(data) {
        if (!peerConnection) initWebRTC();

        try {
            if (data.type === 'join') {
                dataChannel = peerConnection.createDataChannel('fileTransfer');
                setupDataChannel();
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                roomChannel.send({ type: 'broadcast', event: 'signal', payload: { type: 'offer', sdp: offer.sdp } });
            } 
            else if (data.type === 'offer') {
                // Cegah error jika state tidak stabil
                if (peerConnection.signalingState !== 'stable') return; 
                
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                roomChannel.send({ type: 'broadcast', event: 'signal', payload: { type: 'answer', sdp: answer.sdp } });
            } 
            else if (data.type === 'answer') {
                // FIX: Hanya proses answer jika PC sedang menunggu jawaban (have-local-offer)
                if (peerConnection.signalingState !== 'have-local-offer') return; 
                
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data));
            } 
            else if (data.type === 'ice-candidate') {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        } catch (error) {
            console.error("WebRTC State Error diabaikan:", error);
        }
    }

    function initWebRTC() {
        peerConnection = new RTCPeerConnection(rtcConfig);
        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                roomChannel.send({ type: 'broadcast', event: 'signal', payload: { type: 'ice-candidate', candidate: event.candidate } });
            }
        };
        peerConnection.ondatachannel = event => {
            dataChannel = event.channel;
            setupDataChannel();
        };
    }

    function setupDataChannel() {
        dataChannel.binaryType = 'arraybuffer';
        dataChannel.onopen = () => {
            document.getElementById('status').innerText = "✅ Perangkat Terhubung!";
            document.getElementById('status').style.color = "green";
            resetActivityTimer();
        };

        dataChannel.onmessage = event => {
            resetActivityTimer(); 
            if (typeof event.data === 'string') {
                const msg = JSON.parse(event.data);
                if (msg.type === 'header') {
                    incomingFileInfo = msg;
                    receiveBuffer = [];
                    receivedSize = 0;
                    document.getElementById('progressContainer').style.display = 'block';
                } else if (msg.type === 'done') {
                    const blob = new Blob(receiveBuffer);
                    downloadFile(blob, incomingFileInfo.name);
                    document.getElementById('progressText').innerText = "Penerimaan Selesai!";
                } else if (msg.type === 'disconnect') {
                    alert("Koneksi diputus oleh perangkat lain.");
                    disconnectAll(false);
                }
            } else {
                receiveBuffer.push(event.data);
                receivedSize += event.data.byteLength;
                const percent = Math.round((receivedSize / incomingFileInfo.size) * 100);
                document.getElementById('progressBar').value = percent;
                document.getElementById('progressText').innerText = `Menerima: ${percent}%`;
            }
        };
    }

    function sendFile() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) return alert('Pilih file dulu!');
        if (!dataChannel || dataChannel.readyState !== 'open') return alert('Koneksi P2P belum siap!');

        resetActivityTimer();
        document.getElementById('progressContainer').style.display = 'block';
        dataChannel.send(JSON.stringify({ type: 'header', name: file.name, size: file.size }));

        const chunkSize = 16384;
        let offset = 0;
        const reader = new FileReader();

        reader.onload = e => {
            dataChannel.send(e.target.result);
            offset += e.target.result.byteLength;
            const percent = Math.round((offset / file.size) * 100);
            document.getElementById('progressBar').value = percent;
            document.getElementById('progressText').innerText = `Mengirim: ${percent}%`;

            if (offset < file.size) {
                readSlice(offset);
            } else {
                dataChannel.send(JSON.stringify({ type: 'done' }));
                document.getElementById('progressText').innerText = "Pengiriman Sukses!";
                resetActivityTimer();
            }
        };

        const readSlice = o => {
            const slice = file.slice(offset, o + chunkSize);
            reader.readAsArrayBuffer(slice);
        };
        readSlice(0);
    }

    function downloadFile(blob, fileName) {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
    }

    function disconnectAll(broadcastDisconnect = true) {
        if (broadcastDisconnect && dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(JSON.stringify({ type: 'disconnect' }));
        }
        if (peerConnection) peerConnection.close();
        if (roomChannel) supabaseClient.removeChannel(roomChannel); // Menggunakan supabaseClient yang baru
        if (inactivityTimer) clearTimeout(inactivityTimer);
        
        window.location.href = window.location.origin + window.location.pathname;
    }
</script>
</body>
</html>
